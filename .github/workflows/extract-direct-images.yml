name: Finalize template builder wording

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-builder:
    if: "!contains(github.event.head_commit.message || '', '[site-v33]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply companion names and cache bust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('template-v1.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '토끼가 풍선 속으로': '포롱이 풍선 속으로',
              '${name}과 토끼는': '${name}과 포롱은',
              '길을 잃은 아기곰': '길을 잃은 몽글',
              '아기곰이 훌쩍이고': '몽글이 훌쩍이고',
              '${name}은 아기곰에게': '${name}은 몽글에게',
              '조금 무서웠지만 여우가': '조금 무서웠지만 해루가',
              '토끼와 아기곰, 여우가': '포롱과 몽글, 해루가',
              '동물 친구들은 풍선을': '포롱과 몽글, 해루는 풍선을'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit builder wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template-v1.js
          git commit -m "Use distinctive companion names in birthday template [site-v33]" || exit 0
          git push origin main

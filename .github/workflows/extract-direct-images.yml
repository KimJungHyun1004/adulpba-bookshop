 이름</label><input id="childName" name="childName" placeholder="예: 다훈" required></div><div class="field"><label for="age">나이</label><input id="age" name="age" placeholder="예: 7세" required></div></div><div class="field"><label>좋아하는 테마</label><div class="chips"><label class="chip"><input type="radio" name="theme" value="바다"><span>🐳 바다</span></label><label class="chip"><input type="radio" name="theme" value="우주"><span>🪐 우주</span></label><label class="chip"><input type="radio" name="theme" value="공룡"><span>🦕 공룡</span></label><label class="chip"><input type="radio" name="theme" value="마법"><span>🪄 마법</span></label><label class="chip"><input type="radio" name="theme" value="탐험"><span>🧭 탐험</span></label><label class="chip"><input type="radio" name="theme" value="미래"><span>🤖 미래</span></label></div></div><div class="field"><label for="likes">아이가 좋아하는 것</label><input id="likes" name="likes" placeholder="예: 기차, 블록, 딸기우유"></div><div class="field"><label for="photoMock">아이 사진 1~3장</label><input id="photoMock" type="text" value="정식 오픈 시 사진 업로드가 연결됩니다" disabled></div><div class="grid2"><div class="field"><label for="parent">보호자 이름</label><input id="parent" name="parent" placeholder="신청자 이름" required></div><div class="field"><label for="contact">연락 방법</label><input id="contact" name="contact" placeholder="이메일 또는 연락처" required></div></div><details class="optional-details"><summary>더 알려주고 싶은 내용이 있어요</summary><div class="optional-fields"><div class="field"><label for="personality">아이 성격</label><input id="personality" name="personality" placeholder="예: 호기심이 많고 동생을 잘 챙겨요"></div><div class="field"><label for="story">기억에 남는 에피소드</label><textarea id="story" name="story" placeholder="전체 제작 때 꼭 넣고 싶은 일이 있다면 적어주세요."></textarea></div><div class="field"><label for="message">아이에게 전하고 싶은 말</label><textarea id="message" name="message" placeholder="예: 언제나 너답게 용감하고 따뜻하게 자라렴."></textarea></div></div></details><div class="form-trust-note"><i>💡</i><div><b>전체 제작 예상가</b><br>eBook 오픈가 15,900원 · 24페이지 하드커버 45,900원 · 32페이지 하드커버 49,900원. 미리보기 확인 후 선택합니다.</div></div><label class="agree"><input type="checkbox" required><span>현재 신청 시안 테스트에 동의합니다. 입력 내용은 실제로 전송되지 않습니다.</span></label><button class="btn btn-primary" type="submit">무료 미리보기 신청 내용 확인</button><div class="result" id="result">신청 화면이 정상적으로 작동해요. 실제 사진 업로드와 접수는 다음 단계에서 연결합니다 😊</div></form></div></section></main>'''

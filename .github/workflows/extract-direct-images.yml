name: Refine brand header and sample cover

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-brand:
    if: "!contains(github.event.head_commit.message || '', '[brand-refine]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refine header and cover presentation
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v21.css <<'CSS'
          .nav{height:96px!important;min-height:96px!important;gap:20px!important}
          .brand.brand-split{display:flex!important;align-items:center!important;gap:12px!important;min-width:0!important;max-width:470px!important;overflow:visible!important}
          .brand-illustration{display:block;flex:0 0 108px;width:108px;height:78px;overflow:hidden;border-radius:18px;background:#fff8e9}
          .brand-illustration img{display:block!important;height:78px!important;width:auto!important;max-width:none!important;transform:translateX(-3px);object-fit:contain!important}
          .brand-copy{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.05}
          .brand-copy strong{display:block!important;font-size:1.72rem!important;line-height:1!important;letter-spacing:-.075em!important;white-space:nowrap!important;margin:0 0 7px!important}
          .brand-word-dark{color:#163f63}
          .brand-word-sky{color:#65aedd}
          .brand-copy small{display:block!important;color:#5f6f79!important;font-size:.76rem!important;line-height:1.34!important;letter-spacing:-.025em!important;white-space:nowrap!important}
          .menu{flex:0 0 auto!important}

          .visual-card{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;min-height:560px!important;padding:78px 26px 26px!important;overflow:hidden!important}
          .visual-card:before{z-index:0!important}
          .visual-card>*{z-index:1}
          .visual-card .float-note{left:22px!important;top:20px!important;right:22px!important;width:auto!important;text-align:center!important;padding:11px 14px!important;font-size:.78rem!important;border-radius:18px!important}
          .book-stage{display:flex;align-items:center;justify-content:center;width:100%;min-height:370px}
          .visual-card .book-cover{position:relative!important;right:auto!important;top:auto!important;width:min(57%,300px)!important;max-height:none!important;transform:rotate(-1.5deg)!important;filter:drop-shadow(0 20px 24px rgba(36,67,90,.24))!important;border-radius:8px!important}
          .visual-card .family-card{display:none!important}
          .cover-caption{width:min(92%,430px);margin-top:16px;padding:14px 18px;background:rgba(255,255,255,.94);border:1px solid rgba(36,67,90,.1);border-radius:20px;text-align:center;box-shadow:0 12px 28px rgba(36,67,90,.09)}
          .cover-caption strong{display:block;font-size:1rem;line-height:1.35;letter-spacing:-.035em;color:#24435a;margin-bottom:4px}
          .cover-caption small{display:block;font-size:.76rem;line-height:1.45;color:#6a8292}

          .story-cover-art{display:flex!important;align-items:center!important;justify-content:center!important;padding:28px!important;background:linear-gradient(135deg,#e9f7fb,#fff3cb)!important}
          .story-cover-image{display:block!important;width:min(68%,320px)!important;height:auto!important;object-fit:contain!important;border-radius:10px!important;box-shadow:0 18px 38px rgba(36,67,90,.2)!important;transform:none!important}

          @media(max-width:980px){
            .nav{height:94px!important;min-height:94px!important}
            .navlinks.open{top:94px!important}
            .brand.brand-split{max-width:calc(100% - 68px)!important;gap:10px!important}
            .brand-illustration{flex-basis:96px;width:96px;height:72px}
            .brand-illustration img{height:72px!important;transform:translateX(-3px)}
            .brand-copy strong{font-size:1.55rem!important}
            .brand-copy small{font-size:.7rem!important}
          }

          @media(max-width:640px){
            header .container.nav{height:94px!important;min-height:94px!important;padding-top:7px!important;padding-bottom:7px!important}
            .brand.brand-split{max-width:calc(100% - 62px)!important;gap:8px!important}
            .brand-illustration{flex-basis:88px;width:88px;height:68px;border-radius:15px}
            .brand-illustration img{height:68px!important;transform:translateX(-2px)}
            .brand-copy strong{font-size:1.42rem!important;margin-bottom:6px!important}
            .brand-copy small{font-size:.63rem!important;line-height:1.3!important;letter-spacing:-.03em!important}
            .menu{width:48px!important;height:48px!important;border-radius:16px!important}

            .visual-card{min-height:505px!important;padding:72px 18px 22px!important}
            .visual-card .float-note{left:16px!important;right:16px!important;top:16px!important;font-size:.72rem!important;padding:10px 11px!important}
            .book-stage{min-height:330px}
            .visual-card .book-cover{width:min(66%,258px)!important;transform:rotate(-1deg)!important}
            .cover-caption{width:94%;margin-top:8px;padding:12px 14px;border-radius:17px}
            .cover-caption strong{font-size:.9rem}
            .cover-caption small{font-size:.7rem}
            .story-cover-art{padding:22px!important}
            .story-cover-image{width:min(72%,280px)!important}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          brand = (
              '<a class="brand brand-split" href="index.html" aria-label="아둘빠 책방 홈">'
              '<span class="brand-illustration" aria-hidden="true">'
              '<img src="assets/adulpba-logo-v20.png?v=21" alt="">'
              '</span>'
              '<span class="brand-copy">'
              '<strong><span class="brand-word-dark">아둘빠</span> <span class="brand-word-sky">책방</span></strong>'
              '<small>아들 둘 아빠가 시작한<br>우리 아이 이야기</small>'
              '</span>'
              '</a><nav class="navlinks">'
          )

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<a class="brand(?: brand-split)?" href="index\.html"[^>]*>.*?</a><nav class="navlinks">',
                  brand,
                  text,
                  count=1,
                  flags=re.S,
              )
              text = text.replace(
                  '<link rel="stylesheet" href="image-fixes-v20.css?v=20">',
                  '<link rel="stylesheet" href="image-fixes-v21.css?v=21">',
              )
              if "image-fixes-v21.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v21.css?v=21"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=21',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          replacement = (
              '<div class="visual-card">'
              '<div class="float-note">두 형제의 취향으로 만든 첫 번째 책 ✨</div>'
              '<div class="book-stage">'
              '<img class="book-cover real-book-cover" src="assets/rubiya-cover-v20.jpg?v=21" alt="루비야, 동화 속으로 데려다줘 책 표지">'
              '</div>'
              '<div class="cover-caption">'
              '<strong>《루비야, 동화 속으로 데려다줘》</strong>'
              '<small>기차와 블록을 좋아하는 두 형제의 실제 놀이에서 시작한 맞춤 동화</small>'
              '</div>'
              '</div>'
          )
          text, count = re.subn(
              r'<div class="visual-card"><div class="float-note">.*?</div><img class="book-cover real-book-cover"[^>]*><div class="family-card"><svg.*?</svg></div></div>',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count == 0 and 'class="cover-caption"' not in text:
              raise RuntimeError("Home cover block was not found")
          index.write_text(text, encoding="utf-8")
          PY

      - name: Commit refined brand layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-fixes-v21.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Refine split logo and cover showcase [brand-refine]" || exit 0
          git push origin main

name: Restore original logo composition

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-logo:
    if: "!contains(github.event.head_commit.message || '', '[logo-original]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore original logo with larger lettering
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v22.css <<'CSS'
          .nav{height:108px!important;min-height:108px!important;gap:20px!important}
          .brand.brand-original{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important;max-width:380px!important;overflow:visible!important}
          .brand-art,.brand-lettering{display:block;flex:0 0 auto;background-image:url("assets/adulpba-logo-v20.png?v=22");background-repeat:no-repeat;background-color:#fff8e9}
          .brand-art{width:106px;height:82px;background-size:246px 82px;background-position:0 0;border-radius:16px}
          .brand-lettering{width:218px;height:118px;background-size:354px 118px;background-position:-143px 0}
          .menu{flex:0 0 auto!important}

          .visual-card{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;min-height:560px!important;padding:78px 26px 26px!important;overflow:hidden!important}
          .visual-card:before{z-index:0!important}
          .visual-card>*{z-index:1}
          .visual-card .float-note{left:22px!important;top:20px!important;right:22px!important;width:auto!important;text-align:center!important;padding:11px 14px!important;font-size:.78rem!important;border-radius:18px!important}
          .book-stage{display:flex;align-items:center;justify-content:center;width:100%;min-height:370px}
          .visual-card .book-cover{position:relative!important;right:auto!important;top:auto!important;width:min(57%,300px)!important;max-height:none!important;transform:rotate(-1.5deg)!important;filter:drop-shadow(0 20px 24px rgba(36,67,90,.24))!important;border-radius:8px!important}
          .visual-card .family-card{display:none!important}
          .cover-caption{width:min(92%,430px);margin-top:16px;padding:14px 18px;background:rgba(255,255,255,.94);border:1px solid rgba(36,67,90,.1);border-radius:20px;text-align:center;box-shadow:0 12px 28px rgba(36,67,90,.09)}
          .cover-caption strong{display:block;font-size:1rem;line-height:1.35;letter-spacing:-.035em;color:#24435a;margin-bottom:4px}
          .cover-caption small{display:block;font-size:.76rem;line-height:1.45;color:#6a8292}
          .story-cover-art{display:flex!important;align-items:center!important;justify-content:center!important;padding:28px!important;background:linear-gradient(135deg,#e9f7fb,#fff3cb)!important}
          .story-cover-image{display:block!important;width:min(68%,320px)!important;height:auto!important;object-fit:contain!important;border-radius:10px!important;box-shadow:0 18px 38px rgba(36,67,90,.2)!important;transform:none!important}

          @media(max-width:980px){
            .nav{height:102px!important;min-height:102px!important}
            .navlinks.open{top:102px!important}
            .brand.brand-original{max-width:calc(100% - 68px)!important;gap:8px!important}
            .brand-art{width:94px;height:74px;background-size:222px 74px}
            .brand-lettering{width:202px;height:112px;background-size:336px 112px;background-position:-136px 0}
          }

          @media(max-width:640px){
            header .container.nav{height:100px!important;min-height:100px!important;padding-top:6px!important;padding-bottom:6px!important}
            .brand.brand-original{max-width:calc(100% - 60px)!important;gap:6px!important}
            .brand-art{width:88px;height:70px;background-size:210px 70px;background-position:0 0;border-radius:14px}
            .brand-lettering{width:190px;height:106px;background-size:318px 106px;background-position:-128px 0}
            .menu{width:48px!important;height:48px!important;border-radius:16px!important}

            .visual-card{min-height:505px!important;padding:72px 18px 22px!important}
            .visual-card .float-note{left:16px!important;right:16px!important;top:16px!important;font-size:.72rem!important;padding:10px 11px!important}
            .book-stage{min-height:330px}
            .visual-card .book-cover{width:min(66%,258px)!important;transform:rotate(-1deg)!important}
            .cover-caption{width:94%;margin-top:8px;padding:12px 14px;border-radius:17px}
            .cover-caption strong{font-size:.9rem}
            .cover-caption small{font-size:.7rem}
            .story-cover-art{padding:22px!important}
            .story-cover-image{width:min(72%,280px)!important}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          brand = (
              '<a class="brand brand-original" href="index.html" aria-label="아둘빠 책방 홈">'
              '<span class="brand-art" aria-hidden="true"></span>'
              '<span class="brand-lettering" aria-hidden="true"></span>'
              '</a><nav class="navlinks">'
          )

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<a class="brand(?: [^"]*)?" href="index\.html"[^>]*>.*?</a><nav class="navlinks">',
                  brand,
                  text,
                  count=1,
                  flags=re.S,
              )
              text = re.sub(
                  r'<link rel="stylesheet" href="image-fixes-v\d+\.css\?v=\d+">',
                  '<link rel="stylesheet" href="image-fixes-v22.css?v=22">',
                  text,
              )
              if "image-fixes-v22.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v22.css?v=22"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=22',
                  text,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit original logo layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-fixes-v22.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Restore original logo and enlarge lettering [logo-original]" || exit 0
          git push origin main

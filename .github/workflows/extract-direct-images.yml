name: Apply final logo and cover

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-assets:
    if: "!contains(github.event.head_commit.message || '', '[asset-layout]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply uploaded final assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s assets/adulpba-logo-v20.jpg ] || [ ! -s assets/rubiya-cover-v20.jpg ]; then
            echo "Final image files are not uploaded yet. Nothing to apply."
            exit 0
          fi

          cat > image-fixes-v20.css <<'CSS'
          .brand{display:flex!important;align-items:center!important;min-width:0!important;max-width:calc(100% - 78px)!important;overflow:hidden!important}
          .combined-header-logo{display:block!important;width:280px!important;max-width:100%!important;height:auto!important;max-height:74px!important;object-fit:contain!important;background:transparent!important}
          .real-book-cover{display:block!important;height:auto!important;object-fit:contain!important;image-rendering:auto!important}
          .visual-card .book-cover{width:min(58%,310px)!important;max-height:none!important}
          .story-cover-art{display:flex!important;align-items:center!important;justify-content:center!important;padding:24px!important;background:linear-gradient(135deg,#e9f7fb,#fff3cb)!important}
          .story-cover-image{display:block!important;width:min(78%,310px)!important;height:auto!important;object-fit:contain!important;border-radius:12px!important;box-shadow:0 18px 38px rgba(36,67,90,.2)!important}
          @media(max-width:980px){
            .nav{height:84px!important;min-height:84px!important}
            .combined-header-logo{width:235px!important;max-width:calc(100vw - 110px)!important;max-height:72px!important}
          }
          @media(max-width:640px){
            header .container.nav{height:84px!important;min-height:84px!important;padding-top:6px!important;padding-bottom:6px!important}
            .brand{max-width:calc(100% - 72px)!important}
            .combined-header-logo{width:220px!important;max-width:calc(100vw - 98px)!important;max-height:70px!important}
            .visual-card .book-cover{width:min(66%,300px)!important}
            .story-cover-art{padding:20px!important}
            .story-cover-image{width:min(74%,280px)!important}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"assets/(?:logo-base|logo-header|adulpba-logo)(?:-v\d+)?\.(?:svg|jpg)(?:\?v=\d+)?",
                  "assets/adulpba-logo-v20.jpg?v=20",
                  text,
              )
              text = re.sub(
                  r"assets/(?:sample-book-rubiya-cover|rubiya-cover-final|rubiya-cover)(?:-v\d+)?\.(?:svg|jpg)(?:\?v=\d+)?",
                  "assets/rubiya-cover-v20.jpg?v=20",
                  text,
              )
              text = re.sub(
                  r"script(?:-v\d+)?\.js(?:\?v=\d+)?",
                  "script.js?v=20",
                  text,
              )
              if "image-fixes-v20.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v20.css?v=20"></head>',
                      1,
                  )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit final asset layout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s assets/adulpba-logo-v20.jpg ] || [ ! -s assets/rubiya-cover-v20.jpg ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adulpba-logo-v20.jpg assets/rubiya-cover-v20.jpg image-fixes-v20.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Apply final logo and cover layout [asset-layout]" || exit 0
          git push origin main

name: Fix mobile hero and clarify eBook upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-title-and-upgrade:
    if: "!contains(github.event.head_commit.message || '', '[site-v27]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fix product hero wrapping and clarify hardcover add-on
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v27.css <<'CSS'
          @import url("image-fixes-v26.css?v=26");

          .product-hero-title .mobile-title{display:none}
          .product-hero-title .desktop-title{display:block}
          .page-hero .product-hero-title{max-width:980px;text-wrap:balance;word-break:keep-all}
          .page-hero .product-hero-copy{word-break:keep-all;max-width:760px}

          .ebook-credit-banner{margin-top:18px;padding:16px 18px;border-radius:18px;background:#eaf7ee;border:1px solid #c7e5d1;color:#326849;font-size:.82rem;line-height:1.55}
          .ebook-credit-banner b{display:block;color:#234f38;font-size:.92rem;margin-bottom:3px}

          @media(max-width:640px){
            .page-hero{padding:44px 0 38px!important}
            .product-hero-title .desktop-title{display:none}
            .product-hero-title .mobile-title{display:block}
            .page-hero .product-hero-title{font-size:clamp(2.08rem,9.2vw,2.32rem)!important;line-height:1.16!important;letter-spacing:-.055em!important;margin:16px 0 17px!important}
            .product-hero-title .mobile-title span{display:block;white-space:nowrap}
            .page-hero .product-hero-copy{font-size:.94rem!important;line-height:1.75!important}
            .product-intro-note{font-size:.82rem!important;line-height:1.7!important;padding:15px!important}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<link rel="stylesheet" href="image-fixes-v\d+\.css\?v=\d+">',
                  '<link rel="stylesheet" href="image-fixes-v27.css?v=27">',
                  text,
              )
              if "image-fixes-v27.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v27.css?v=27"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=27',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          products = Path("products.html")
          text = products.read_text(encoding="utf-8")

          old_title = '<h1>아이 사진으로 먼저 만나보고,<br>마음에 들면 한 권으로 만듭니다.</h1>'
          new_title = '<h1 class="product-hero-title"><span class="desktop-title">아이 사진으로 먼저 만나보고,<br>마음에 들면 한 권으로 만듭니다.</span><span class="mobile-title"><span>아이 사진으로</span><span>먼저 만나보고,</span><span>마음에 들면</span><span>한 권으로 만듭니다.</span></span></h1>'
          text = text.replace(old_title, new_title, 1)
          text = text.replace(
              '<p>맞춤 표지와 예시 2페이지를 먼저 확인한 뒤 전자책 또는 하드커버 실물책을 선택하는 방식으로 준비하고 있습니다.</p>',
              '<p class="product-hero-copy">맞춤 표지와 예시 2페이지를 먼저 확인한 뒤 전자책 또는 하드커버 실물책을 선택하는 방식으로 준비하고 있습니다.</p>',
              1,
          )

          text = text.replace(
              'eBook → 하드커버 업그레이드',
              'eBook 구매 후 실물책 추가',
          )
          text = text.replace(
              'eBook을 먼저 구매한 뒤 실물책이 갖고 싶어져도 이중으로 결제하지 않습니다. 같은 이야기의 하드커버 1권으로 업그레이드할 때 실제 eBook 결제금액을 전액 차감합니다.',
              'eBook을 먼저 구매한 뒤 실물책이 갖고 싶어지면 같은 이야기의 하드커버 1권을 추가로 주문할 수 있습니다. 이때 실제 eBook 결제금액을 전액 차감하며, 구매한 PDF는 그대로 소장합니다.',
          )
          text = text.replace(
              '24페이지 하드커버로 업그레이드',
              '24페이지 하드커버 추가 주문',
          )
          text = text.replace(
              '32페이지 하드커버로 업그레이드',
              '32페이지 하드커버 추가 주문',
          )
          text = text.replace(
              '결국 처음부터 하드커버를 산 것과 같은 총금액이에요.',
              'PDF는 그대로 소장하고, 총 결제금액은 처음부터 하드커버를 산 것과 같아요.',
          )
          text = text.replace(
              '나중에 하드커버로 바꿔도 손해 없음',
              '나중에 하드커버를 추가해도 손해 없음',
          )
          text = text.replace(
              '60일 이내 업그레이드 시 실제 eBook 결제금액 전액 차감',
              '60일 이내 실물책 추가 주문 시 실제 eBook 결제금액 전액 차감',
          )
          products.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              'eBook으로 먼저 구매해도 손해 없어요.',
              'eBook으로 먼저 구매해도 손해 없어요.',
          )
          text = text.replace(
              '구매 후 60일 이내 같은 이야기의 하드커버 1권으로 업그레이드하면 실제 결제한 eBook 금액을 전액 빼드립니다.',
              '구매 후 60일 이내 같은 이야기의 하드커버 1권을 추가 주문하면 실제 결제한 eBook 금액을 전액 빼드립니다. PDF는 그대로 소장해요.',
          )
          text = text.replace(
              '하드커버 업그레이드 시 실제 eBook 결제금액 전액 차감',
              '하드커버 추가 주문 시 실제 eBook 결제금액 전액 차감',
          )
          text = text.replace(
              'eBook 구매 후 60일 안에 실물책으로 바꿔도 결제금액을 차감해요.',
              'eBook 구매 후 60일 안에 실물책을 추가하면 결제금액을 차감해요.',
          )
          index.write_text(text, encoding="utf-8")

          apply = Path("apply.html")
          text = apply.read_text(encoding="utf-8")
          text = text.replace(
              'eBook 구매 뒤 60일 이내 실물책으로 업그레이드하면 실제 결제금액을 전액 차감하는 방식으로 준비 중입니다.',
              'eBook 구매 뒤 60일 이내 같은 이야기의 실물책을 추가 주문하면 실제 결제금액을 전액 차감하며, PDF는 그대로 소장하는 방식으로 준비 중입니다.',
          )
          apply.write_text(text, encoding="utf-8")
          PY

      - name: Commit mobile title and upgrade wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-fixes-v27.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Fix mobile title wrapping and clarify eBook credit [site-v27]" || exit 0
          git push origin main

name: Add transparent preview pricing

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  preview-pricing:
    if: "!contains(github.event.head_commit.message || '', '[site-v25]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Emphasize free preview with transparent prices
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v25.css <<'CSS'
          @import url("image-fixes-v24.css?v=24");

          .hero-price-summary{margin:18px 0 17px;padding:16px 18px;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 26px rgba(36,67,90,.06)}
          .hero-price-summary>strong{display:block;font-size:.78rem;color:#4e7d95;margin-bottom:7px}
          .hero-price-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1rem;letter-spacing:-.03em}
          .hero-price-row b{font-size:1.08rem;color:var(--navy)}
          .hero-price-row i{font-style:normal;color:#9aabb5}
          .hero-price-summary small{display:block;margin-top:6px;color:var(--muted);font-size:.72rem;line-height:1.45}
          .hero .hero-actions{margin-bottom:0!important}
          .hero-free-label{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:4px 8px;border-radius:999px;background:#e8f7ec;color:#24734a;font-size:.7rem;font-weight:900;vertical-align:middle}

          .preview-promise{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;margin-top:20px}
          .preview-promise-main,.preview-promise-price{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px 18px}
          .preview-promise-main strong,.preview-promise-price strong{display:block;margin-bottom:5px}
          .preview-promise-main span,.preview-promise-price span{display:block;color:var(--muted);font-size:.82rem;line-height:1.5}
          .preview-promise-price b{display:block;font-size:1.12rem;margin-top:8px;color:var(--navy)}

          .format-choice-note{margin:0 0 18px;padding:14px 16px;background:#eef9fd;border:1px solid #cde8f3;border-radius:16px;color:#476a7f;font-size:.82rem;line-height:1.5}
          .format-choice-note b{color:var(--navy)}

          @media(max-width:640px){
            .hero-price-summary{padding:14px 15px;margin-top:15px}
            .hero-price-row{gap:5px;font-size:.91rem}
            .hero-price-row b{font-size:1rem}
            .preview-promise{grid-template-columns:1fr}
            .preview-promise-main,.preview-promise-price{padding:15px}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  '📚 <b>한 권씩 확인하며</b> 정성껏 만듭니다 · 브랜드 오픈 준비 중',
                  '📚 <b>맞춤 표지와 예시 2페이지</b>를 먼저 확인하세요 · 오픈 준비 중',
              )
              text = re.sub(
                  r'<link rel="stylesheet" href="image-fixes-v\d+\.css\?v=\d+">',
                  '<link rel="stylesheet" href="image-fixes-v25.css?v=25">',
                  text,
              )
              if "image-fixes-v25.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v25.css?v=25"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=25',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              '<span class="eyebrow">✨ 아이와 가족의 이야기를 책으로</span>',
              '<span class="eyebrow">✨ 사진 한 장으로 시작하는 우리 아이 책</span>',
              1,
          )
          text = text.replace(
              '<p class="lead">이름만 바꾸는 책이 아닙니다. 아이의 성격, 좋아하는 것, 가족의 관계와 실제 순간을 담아 동화와 성장 이야기로 만듭니다.</p>',
              '<p class="lead">아이 사진으로 맞춤 표지와 예시 2페이지를 먼저 확인하세요. 마음에 들면 전자책 또는 하드커버 실물책으로 전체 이야기를 완성합니다.</p>',
              1,
          )
          old_actions = '<div class="hero-actions"><a class="btn btn-primary" href="products.html">책 구성과 예상 가격 보기 →</a><a class="btn btn-soft" href="apply.html">미리보기 신청 준비하기</a></div>'
          new_actions = '<div class="hero-actions"><a class="btn btn-primary" href="apply.html?mode=preview">무료 미리보기 신청하기 <span class="hero-free-label">결제 전</span></a><a class="btn btn-soft" href="products.html#formats">가격과 구성 보기</a></div><div class="hero-price-summary"><strong>전체 책은 미리보기 확인 후 선택</strong><div class="hero-price-row"><b>eBook 18,900원</b><i>·</i><b>하드커버 45,900원부터</b></div><small>맞춤 표지와 예시 2페이지는 먼저 확인 · 최종 판매가와 무료배송 여부는 오픈 전 확정</small></div>'
          text = text.replace(old_actions, new_actions, 1)
          text = text.replace(
              '<div class="preview-flow-head"><strong>처음부터 결제하지 않아도 괜찮아요.</strong><span>아이 사진으로 표지와 예시 2페이지를 먼저 확인한 뒤 전체 제작을 선택하는 방식으로 준비하고 있습니다.</span></div>',
              '<div class="preview-flow-head"><strong>우리 아이가 책 속에 들어간 모습부터 무료로 확인해보세요.</strong><span>맞춤 표지와 예시 2페이지를 보고 마음에 들 때만 전체 전자책 또는 하드커버 제작을 선택합니다.</span></div>',
              1,
          )
          text = text.replace(
              '<a class="btn btn-sky" href="products.html">상품 구성 자세히 보기</a>',
              '<a class="btn btn-sky" href="apply.html?mode=preview">무료 미리보기 신청하기</a>',
              1,
          )
          index.write_text(text, encoding="utf-8")

          apply = Path("apply.html")
          text = apply.read_text(encoding="utf-8")
          text = text.replace('<title>제작 신청 | 아둘빠 책방</title>', '<title>무료 미리보기 신청 | 아둘빠 책방</title>', 1)
          text = text.replace('<span class="eyebrow">제작 신청 시안</span>', '<span class="eyebrow">무료 미리보기 신청 시안</span>', 1)
          text = text.replace(
              '<h1>어렵게 쓰지 않아도 괜찮아요.<br>아이 이야기는 함께 찾아갑니다.</h1><p>현재는 브랜드 준비 단계의 신청 시안입니다. 입력 내용은 서버로 전송되지 않으며 사진 업로드도 아직 연결하지 않았습니다.</p>',
              '<h1>우리 아이가 책 속에 들어간 모습,<br>먼저 확인해보세요.</h1><p>사진과 기본 정보를 바탕으로 맞춤 표지와 예시 2페이지를 먼저 보여드리는 신청 화면입니다. 현재는 브랜드 준비 단계라 입력 내용과 사진이 실제로 전송되지는 않습니다.</p><div class="preview-promise"><div class="preview-promise-main"><strong>결제 전 무료 미리보기</strong><span>맞춤 표지와 예시 2페이지를 먼저 확인한 뒤 전체 제작 여부를 결정합니다.</span></div><div class="preview-promise-price"><strong>전체 제작 예상가</strong><span>가격을 숨기지 않고 미리 안내합니다.</span><b>eBook 18,900원 · 하드커버 45,900원부터</b></div></div>',
              1,
          )
          text = text.replace(
              '<h2>먼저 만들고 싶은 책을 골라주세요.</h2><p>선택한 책에 따라 상담할 내용이 달라집니다.</p>',
              '<h2>무료 미리보기에 필요한 내용만 알려주세요.</h2><p>표지와 예시 장면을 만들기 위한 기본 정보입니다.</p>',
              1,
          )
          marker = '<div class="field"><label for="storyType">이야기 제작 방식</label><select id="storyType" name="storyType"><option value="">선택해주세요</option><option>준비된 이야기형</option><option>새 스토리 제작형</option><option>실제 사진·기록형</option></select></div>'
          addition = marker + '<div class="format-choice-note"><b>지금은 결제하지 않습니다.</b> 미리보기 확인 후 eBook 18,900원, 24페이지 하드커버 45,900원, 32페이지 하드커버 49,900원 중 선택하는 흐름으로 준비 중입니다.</div><div class="field"><label for="bookFormat">미리 생각해둔 완성 방식</label><select id="bookFormat" name="bookFormat"><option value="">아직 정하지 않았어요</option><option>eBook PDF · 예상 18,900원</option><option>24페이지 하드커버 · 예상 45,900원</option><option>32페이지 하드커버 · 예상 49,900원</option></select></div>'
          if 'id="bookFormat"' not in text:
              text = text.replace(marker, addition, 1)
          text = text.replace('신청 내용 미리 확인하기', '무료 미리보기 신청 내용 확인하기', 1)
          apply.write_text(text, encoding="utf-8")
          PY

      - name: Commit transparent preview pricing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-fixes-v25.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Add free preview CTA with transparent prices [site-v25]" || exit 0
          git push origin main

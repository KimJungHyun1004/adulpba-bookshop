name: Fix homepage title and clarify four-page preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  preview-pages-and-title:
    if: "!contains(github.event.head_commit.message || '', '[site-v29]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fix nested mobile title wrapping and preview wording
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v29.css <<'CSS'
          @import url("image-fixes-v28.css?v=28");

          /* The old selector also turned the highlighted words into a full-width block. */
          .mobile-title>span{display:block!important;white-space:nowrap!important}
          .mobile-title span span,
          .mobile-title .highlight{display:inline-block!important;white-space:nowrap!important;width:auto!important}

          @media(max-width:640px){
            .hero .sales-title{font-size:clamp(1.95rem,8.15vw,2.2rem)!important;line-height:1.14!important;letter-spacing:-.058em!important}
            .hero .sales-title .highlight:after{bottom:2px!important;height:13px!important;left:-2px!important;right:-2px!important}
            .hero .lead{max-width:35rem}
          }

          @media(max-width:370px){
            .hero .sales-title{font-size:1.88rem!important;letter-spacing:-.062em!important}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = ["index.html", "products.html", "stories.html", "themes.html", "guide.html", "apply.html"]

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<link rel="stylesheet" href="image-fixes-v\d+\.css\?v=\d+">',
                  '<link rel="stylesheet" href="image-fixes-v29.css?v=29">',
                  text,
              )
              if "image-fixes-v29.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v29.css?v=29"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=29',
                  text,
              )

              # Use book-accurate wording: one spread is two pages; two spreads are four pages.
              replacements = {
                  '표지와 예시 2페이지 무료 확인': '표지 + 본문 2장면 무료 확인',
                  '맞춤 표지 + 예시 2페이지 · 결제 전': '맞춤 표지 + 본문 2장면(총 4페이지) · 결제 전',
                  '맞춤 표지와 예시 2페이지': '맞춤 표지와 본문 2장면(총 4페이지)',
                  '표지와 예시 2페이지': '표지와 본문 2장면(총 4페이지)',
                  '예시 2페이지': '본문 2장면(총 4페이지)',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              path.write_text(text, encoding="utf-8")

          # Keep the top strip compact on mobile.
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<div class="notice">.*?</div><header>',
                  '<div class="notice">📚 <b>표지 + 본문 2장면 무료 확인</b> · eBook 오픈가 15,900원</div><header>',
                  text,
                  count=1,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit title and preview page wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-fixes-v29.css index.html products.html stories.html themes.html guide.html apply.html
          git commit -m "Fix mobile hero wrapping and label preview as four pages [site-v29]" || exit 0
          git push origin main

name: Complete homepage and book options

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  complete-pages:
    if: "!contains(github.event.head_commit.message || '', '[site-v24]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add preview flow and product options
        shell: bash
        run: |
          set -euo pipefail

          cat > image-fixes-v24.css <<'CSS'
          @import url("image-fixes-v23.css?v=23");

          .check span{word-break:keep-all!important}
          .cta-band .eyebrow{color:var(--navy)!important}
          .quick-grid.compact-quick-grid .quick-card{min-height:220px;padding:22px}
          .quick-grid.compact-quick-grid .quick-card h3{margin:15px 0 6px}
          .quick-grid.compact-quick-grid .quick-card p{margin-bottom:14px}

          .home-preview-flow{padding:34px 0;background:#fffdf8;border-top:1px solid rgba(234,223,205,.7);border-bottom:1px solid rgba(234,223,205,.7)}
          .preview-flow-head{text-align:center;margin-bottom:20px}
          .preview-flow-head strong{display:block;font-size:1.25rem;letter-spacing:-.04em;margin-bottom:4px}
          .preview-flow-head span{color:var(--muted);font-size:.9rem}
          .preview-flow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
          .preview-flow-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px 16px;min-height:118px;box-shadow:0 9px 22px rgba(36,67,90,.05)}
          .preview-flow-item em{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--sky2);font-style:normal;font-size:.74rem;font-weight:900;color:#397c9d;margin-bottom:10px}
          .preview-flow-item b{display:block;font-size:.98rem;margin-bottom:3px}
          .preview-flow-item small{display:block;color:var(--muted);font-size:.78rem;line-height:1.45}

          .product-intro-note{margin-top:18px;padding:15px 18px;border-radius:17px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:.88rem}
          .product-intro-note b{color:var(--navy)}
          .process-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
          .process-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;min-height:190px;box-shadow:0 10px 28px rgba(36,67,90,.05)}
          .process-card em{font-style:normal;color:#5a9bbb;font-size:.72rem;font-weight:900}
          .process-card .process-icon{font-size:2rem;margin:13px 0 10px}
          .process-card h3{font-size:1.12rem;margin:0 0 7px}
          .process-card p{font-size:.86rem;color:var(--muted);margin:0}

          .offer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
          .offer-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;min-height:440px;box-shadow:0 14px 34px rgba(36,67,90,.07)}
          .offer-card.featured{border:3px solid var(--sky);transform:translateY(-8px);box-shadow:0 20px 45px rgba(36,67,90,.13)}
          .offer-badge{position:absolute;right:18px;top:18px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:900}
          .offer-icon{width:58px;height:58px;border-radius:18px;background:var(--sky2);display:grid;place-items:center;font-size:1.8rem;margin-bottom:18px}
          .offer-card h2{font-size:1.55rem;margin:0 0 7px}
          .offer-card .offer-sub{color:var(--muted);font-size:.87rem;min-height:48px}
          .offer-price-label{font-size:.73rem;font-weight:850;color:#5c8296;margin-top:19px}
          .offer-price{font-size:2rem;letter-spacing:-.05em;font-weight:950;line-height:1.2;margin:4px 0 17px}
          .offer-list{display:grid;gap:9px;margin:0 0 22px;padding:0;list-style:none}
          .offer-list li{position:relative;padding-left:20px;font-size:.86rem;color:#526c7e}
          .offer-list li:before{content:"✓";position:absolute;left:0;color:#25916d;font-weight:950}
          .offer-card .btn{margin-top:auto;width:100%}
          .pricing-caution{margin-top:22px;text-align:center;color:var(--muted);font-size:.84rem}

          .story-choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
          .story-choice{background:#fff;border:1px solid var(--line);border-radius:23px;padding:23px}
          .story-choice .emoji{font-size:2rem;margin-bottom:12px}
          .story-choice h3{font-size:1.25rem;margin:0 0 7px}
          .story-choice p{color:var(--muted);font-size:.87rem;margin-bottom:13px}
          .story-choice a{font-size:.84rem;font-weight:900;color:#337797}

          .format-note{display:grid;grid-template-columns:44px 1fr;gap:13px;align-items:start;margin-top:24px;padding:18px;background:#fff7d7;border:1px solid #efd98e;border-radius:20px}
          .format-note i{font-style:normal;width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.3rem}
          .format-note b{display:block;margin-bottom:3px}
          .format-note span{display:block;color:#6d664e;font-size:.84rem;line-height:1.55}

          @media(max-width:980px){
            .preview-flow-grid,.process-grid{grid-template-columns:repeat(2,1fr)}
            .offer-grid{grid-template-columns:1fr}
            .offer-card{min-height:0}
            .offer-card.featured{transform:none}
            .story-choice-grid{grid-template-columns:1fr}
          }

          @media(max-width:640px){
            .home-preview-flow{padding:28px 0}
            .preview-flow-grid{grid-template-columns:1fr 1fr;gap:9px}
            .preview-flow-item{min-height:112px;padding:15px 13px;border-radius:17px}
            .preview-flow-head strong{font-size:1.12rem}
            .preview-flow-head span{font-size:.8rem}
            .quick-grid.compact-quick-grid .quick-card{min-height:0;padding:20px}
            .quick-grid.compact-quick-grid .quick-card .icon{width:50px;height:50px;font-size:1.55rem}
            .process-grid{grid-template-columns:1fr}
            .process-card{min-height:0;padding:19px}
            .offer-card{padding:22px;min-height:0;border-radius:24px}
            .offer-price{font-size:1.8rem}
            .story-choice{padding:20px}
            .format-note{grid-template-columns:38px 1fr;padding:15px}
            .format-note i{width:38px;height:38px}
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]

          old_notice = '📚 <b>매달 세 가족</b>의 이야기만 천천히 만듭니다 · 브랜드 오픈 준비 중'
          new_notice = '📚 <b>한 권씩 확인하며</b> 정성껏 만듭니다 · 브랜드 오픈 준비 중'

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_notice, new_notice)
              text = re.sub(
                  r'<link rel="stylesheet" href="image-fixes-v\d+\.css\?v=\d+">',
                  '<link rel="stylesheet" href="image-fixes-v24.css?v=24">',
                  text,
              )
              if "image-fixes-v24.css" not in text:
                  text = text.replace(
                      "</head>",
                      '<link rel="stylesheet" href="image-fixes-v24.css?v=24"></head>',
                      1,
                  )
              text = re.sub(
                  r'script(?:-v\d+)?\.js(?:\?v=\d+)?',
                  'script.js?v=24',
                  text,
              )
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              '<div class="hero-actions"><a class="btn btn-primary" href="products.html">어떤 책을 만들지 보기 →</a><a class="btn btn-soft" href="apply.html">우리 이야기 상담하기</a></div>',
              '<div class="hero-actions"><a class="btn btn-primary" href="products.html">책 구성과 예상 가격 보기 →</a><a class="btn btn-soft" href="apply.html">미리보기 신청 준비하기</a></div>',
          )
          text = text.replace(
              '<div class="hero-meta"><span><i>✓</i> 하드커버 실물 제작</span><span><i>✓</i> 사진·스토리 맞춤</span><span><i>✓</i> 월 3권 소량 제작</span></div>',
              '<div class="hero-meta"><span><i>✓</i> 하드커버 실물 제작</span><span><i>✓</i> 아이 사진·이름 반영</span><span><i>✓</i> 예시 2페이지 먼저 확인</span></div>',
          )

          preview = (
              '<section class="home-preview-flow"><div class="container">'
              '<div class="preview-flow-head"><strong>처음부터 결제하지 않아도 괜찮아요.</strong>'
              '<span>아이 사진으로 표지와 예시 2페이지를 먼저 확인한 뒤 전체 제작을 선택하는 방식으로 준비하고 있습니다.</span></div>'
              '<div class="preview-flow-grid">'
              '<div class="preview-flow-item"><em>01</em><b>사진과 정보 접수</b><small>아이 사진, 이름, 나이와 좋아하는 것을 알려주세요.</small></div>'
              '<div class="preview-flow-item"><em>02</em><b>미리보기 확인</b><small>맞춤 표지와 예시 2페이지로 분위기를 먼저 확인해요.</small></div>'
              '<div class="preview-flow-item"><em>03</em><b>상품 선택·결제</b><small>전자책 또는 하드커버 책 중 원하는 구성을 고릅니다.</small></div>'
              '<div class="preview-flow-item"><em>04</em><b>전체 책 제작</b><small>나머지 장면을 완성하고 최종 확인 후 전달합니다.</small></div>'
              '</div></div></section>'
          )
          marker = '</div></div></section><section class="section white"><div class="container sample">'
          if 'home-preview-flow' not in text and marker in text:
              text = text.replace(marker, '</div></div></section>' + preview + '<section class="section white"><div class="container sample">', 1)

          text = text.replace('<div class="quick-grid">', '<div class="quick-grid compact-quick-grid">', 1)

          old_cta = (
              '<section class="section white"><div class="container cta-band"><div><span class="eyebrow">월 3권 한정 제작</span>'
              '<h2 style="font-size:clamp(2rem,3.6vw,3.4rem);line-height:1.15;letter-spacing:-.05em;margin:17px 0">많이 만들기보다,<br>한 권씩 제대로 만들어요.</h2>'
              '<p>취미에서 시작한 작은 책방이라 매달 세 가족의 이야기만 받습니다. 신청 내용을 확인한 뒤 제작 가능 일정부터 안내드려요.</p>'
              '<a class="btn btn-sky" href="apply.html">이번 달 제작 문의</a></div><div class="slots">'
              '<div class="slot"><strong>첫 번째 이야기</strong><small>브랜드 샘플 제작 완료</small></div>'
              '<div class="slot open"><strong>두 번째 이야기</strong><small>신청 가능</small></div>'
              '<div class="slot open"><strong>세 번째 이야기</strong><small>신청 가능</small></div>'
              '</div></div></section>'
          )
          new_cta = (
              '<section class="section white"><div class="container cta-band"><div><span class="eyebrow">브랜드 오픈 준비 중</span>'
              '<h2 style="font-size:clamp(2rem,3.6vw,3.4rem);line-height:1.15;letter-spacing:-.05em;margin:17px 0">먼저 샘플로 확인하고,<br>마음에 들면 한 권으로.</h2>'
              '<p>아이 사진과 기본 정보를 보내주시면 맞춤 표지와 예시 2페이지를 먼저 보여드리는 방식으로 준비하고 있습니다.</p>'
              '<a class="btn btn-sky" href="products.html">상품 구성 자세히 보기</a></div><div class="slots">'
              '<div class="slot open"><strong>01 · 사진과 이야기 접수</strong><small>아이의 특징과 원하는 테마를 확인해요.</small></div>'
              '<div class="slot open"><strong>02 · 표지와 예시 2페이지</strong><small>결제 전에 전체 분위기를 먼저 확인해요.</small></div>'
              '<div class="slot open"><strong>03 · 결제 후 전체 제작</strong><small>전자책 또는 하드커버로 완성합니다.</small></div>'
              '</div></div></section>'
          )
          text = text.replace(old_cta, new_cta)
          index.write_text(text, encoding="utf-8")

          products = Path("products.html")
          text = products.read_text(encoding="utf-8")
          main = '''<main>
          <section class="page-hero"><div class="container"><span class="eyebrow">책 만들기</span><h1>아이 사진으로 먼저 만나보고,<br>마음에 들면 한 권으로 만듭니다.</h1><p>맞춤 표지와 예시 2페이지를 먼저 확인한 뒤 전자책 또는 하드커버 실물책을 선택하는 방식으로 준비하고 있습니다.</p><div class="product-intro-note"><b>현재는 브랜드 오픈 준비 단계입니다.</b> 아래 금액은 비교 조사와 목표 원가를 기준으로 잡은 예상 출시가이며, 샘플 인쇄 견적 후 최종 확정됩니다.</div></div></section>

          <section class="section white"><div class="container"><div class="head center"><span class="eyebrow">제작 흐름</span><h2>결제 전에 우리 아이 책의 분위기부터 확인해요.</h2><p>실제 사진 업로드와 자동 미리보기 기능은 홈페이지 기본 구성을 마친 뒤 연결할 예정입니다.</p></div><div class="process-grid"><article class="process-card"><em>STEP 01</em><div class="process-icon">📷</div><h3>사진과 기본정보</h3><p>아이 사진 1~3장, 이름, 나이, 좋아하는 것과 원하는 테마를 입력합니다.</p></article><article class="process-card"><em>STEP 02</em><div class="process-icon">✨</div><h3>예시 2페이지 확인</h3><p>맞춤 표지와 대표 장면을 먼저 보고 아이의 모습과 이야기 분위기를 확인합니다.</p></article><article class="process-card"><em>STEP 03</em><div class="process-icon">💳</div><h3>상품 선택·결제</h3><p>전자책, 24페이지 하드커버, 32페이지 하드커버 중 원하는 구성을 선택합니다.</p></article><article class="process-card"><em>STEP 04</em><div class="process-icon">📚</div><h3>전체 책 완성</h3><p>나머지 페이지를 제작하고 최종 확인을 거쳐 PDF 전달 또는 인쇄·배송합니다.</p></article></div></div></section>

          <section class="section blue" id="formats"><div class="container"><div class="head center"><span class="eyebrow">상품 구성</span><h2>보고 싶은 방식과 간직할 방식으로 골라보세요.</h2><p>하드커버 실물책에는 완성된 eBook PDF를 함께 제공하는 구성을 검토 중입니다.</p></div><div class="offer-grid"><article class="offer-card"><div class="offer-icon">📱</div><h2>eBook PDF</h2><p class="offer-sub">배송 없이 휴대폰·태블릿에서 바로 보는 우리 아이의 전자책</p><div class="offer-price-label">예상 출시가</div><div class="offer-price">18,900원</div><ul class="offer-list"><li>전체 이야기 PDF 제공</li><li>휴대폰·태블릿 열람</li><li>인쇄·배송비 없음</li><li>개인 소장용 파일</li></ul><a class="btn btn-soft" href="apply.html?format=ebook">미리보기 신청 준비</a></article><article class="offer-card"><div class="offer-icon">📘</div><h2>24페이지 하드커버</h2><p class="offer-sub">짧고 선명한 이야기로 부담 없이 간직하는 기본 실물책</p><div class="offer-price-label">예상 출시가</div><div class="offer-price">45,900원</div><ul class="offer-list"><li>표지가 단단한 일반 하드커버</li><li>속지는 일반 컬러 종이</li><li>eBook PDF 포함 예정</li><li>간결한 24페이지 구성</li></ul><a class="btn btn-primary" href="apply.html?format=24p">이 구성으로 준비하기</a></article><article class="offer-card featured"><span class="offer-badge">추천</span><div class="offer-icon">📖</div><h2>32페이지 하드커버</h2><p class="offer-sub">장면과 감정을 더 충분히 담는 아둘빠 책방의 주력 예정 상품</p><div class="offer-price-label">예상 출시가</div><div class="offer-price">49,900원</div><ul class="offer-list"><li>표지가 단단한 일반 하드커버</li><li>속지는 일반 컬러 종이</li><li>eBook PDF 포함 예정</li><li>이야기를 넉넉히 담는 32페이지</li></ul><a class="btn btn-primary" href="apply.html?format=32p">이 구성으로 준비하기</a></article></div><p class="pricing-caution">※ 최종 가격과 무료배송 여부는 1권 샘플 인쇄·포장·배송 견적 확인 후 확정됩니다.</p><div class="format-note"><i>💡</i><div><b>현재 기준은 ‘표지만 단단하고 속지는 종이인 일반 하드커버’입니다.</b><span>표지와 속지가 모두 딱딱한 보드북·올하드북은 제작 방식과 원가가 달라, 추후 별도 상품으로 검토합니다.</span></div></div></div></section>

          <section class="section white"><div class="container"><div class="head center"><span class="eyebrow">이야기 선택</span><h2>어떤 모습의 우리 아이를 남기고 싶나요?</h2><p>책의 형태를 고른 뒤 이야기의 방향을 선택합니다.</p></div><div class="story-choice-grid"><article class="story-choice"><div class="emoji">🌙</div><h3>맞춤 동화책</h3><p>아이를 캐릭터로 만들어 기차, 우주, 공룡, 마법 같은 이야기의 주인공으로 등장시켜요.</p><a href="themes.html">이야기 테마 보기 →</a></article><article class="story-choice"><div class="emoji">🌱</div><h3>성장이야기 책</h3><p>첫돌, 일곱 살, 입학처럼 흩어진 사진과 부모의 기록을 한 시절의 흐름으로 정리해요.</p><a href="apply.html?book=growth">성장이야기 준비하기 →</a></article><article class="story-choice"><div class="emoji">🚀</div><h3>사진 주인공 스토리북</h3><p>아이 얼굴은 그대로 살리고 배경을 이야기 세계로 바꿔 실제 아이가 모험하는 장면을 만들어요.</p><a href="apply.html?book=photo">사진 스토리 준비하기 →</a></article></div></div></section>


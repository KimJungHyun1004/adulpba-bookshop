name: Extract direct image files

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message || '', '[image-extract]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Extract JPEG files from SVG wrappers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          def extract(src: str, dst: str) -> None:
              text = Path(src).read_text(encoding="utf-8")
              marker = "base64,"
              if marker not in text:
                  raise RuntimeError(f"base64 marker missing: {src}")
              payload = text.split(marker, 1)[1].split('"', 1)[0]
              payload = re.sub(r"\s+", "", payload)
              payload += "=" * (-len(payload) % 4)
              data = base64.b64decode(payload)
              Path(dst).write_bytes(data)
              print(f"created {dst}: {len(data)} bytes")

          extract("assets/logo-base.svg", "assets/adulpba-logo.jpg")
          extract("assets/sample-book-rubiya-cover.svg", "assets/rubiya-cover.jpg")

          pages = [
              "index.html", "products.html", "stories.html",
              "themes.html", "guide.html", "apply.html"
          ]
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"assets/logo-(?:base|header)\.svg(?:\?v=\d+)?",
                  "assets/adulpba-logo.jpg?v=19",
                  text,
              )
              text = re.sub(
                  r"assets/(?:sample-book-rubiya-cover|rubiya-cover-final)\.svg(?:\?v=\d+)?",
                  "assets/rubiya-cover.jpg?v=19",
                  text,
              )
              text = re.sub(
                  r"script(?:-v\d+)?\.js(?:\?v=\d+)?",
                  "script.js?v=19",
                  text,
              )
              path.write_text(text, encoding="utf-8")

          Path("script.js").write_text(
              '''const menu=document.querySelector(".menu");
          const nav=document.querySelector(".navlinks");
          menu?.addEventListener("click",()=>nav?.classList.toggle("open"));
          document.querySelectorAll(".navlinks a").forEach(a=>a.addEventListener("click",()=>nav?.classList.remove("open")));
          const current=(location.pathname.split("/").pop()||"index.html").toLowerCase();
          document.querySelectorAll(".navlinks a").forEach(a=>{const target=(a.getAttribute("href")||"").split("#")[0].toLowerCase();if(target===current||(current===""&&target==="index.html"))a.classList.add("active")});
          document.querySelectorAll("[data-year]").forEach(el=>el.textContent=new Date().getFullYear());
          const form=document.getElementById("bookForm");
          form?.addEventListener("submit",e=>{e.preventDefault();const result=document.getElementById("result");result?.classList.add("show");result?.scrollIntoView({behavior:"smooth",block:"center"})});
          ''',
              encoding="utf-8",
          )
          PY

          file assets/adulpba-logo.jpg assets/rubiya-cover.jpg
          test -s assets/adulpba-logo.jpg
          test -s assets/rubiya-cover.jpg

      - name: Commit direct JPG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adulpba-logo.jpg assets/rubiya-cover.jpg index.html products.html stories.html themes.html guide.html apply.html script.js
          git commit -m "Use direct JPG assets [image-extract]" || exit 0
          git push origin main

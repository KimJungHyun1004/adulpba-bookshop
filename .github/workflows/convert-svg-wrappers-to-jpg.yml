name: Convert wrapped images to JPG

on:
  push:
    paths:
      - '.github/workflows/convert-svg-wrappers-to-jpg.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract embedded JPEG assets and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          def extract(source, target):
              text = Path(source).read_text(encoding='utf-8')
              match = re.search(r'data:image/(?:jpeg|jpg);base64,([^"\']+)', text, re.S)
              if not match:
                  raise RuntimeError(f'Embedded JPEG not found in {source}')
              payload = re.sub(r'\s+', '', match.group(1))
              Path(target).write_bytes(base64.b64decode(payload))

          extract('assets/logo-base.svg', 'assets/logo-site.jpg')
          extract('assets/sample-book-rubiya-cover.svg', 'assets/rubiya-cover-site.jpg')

          version = '13'
          html_files = ['index.html', 'products.html', 'stories.html', 'themes.html', 'guide.html', 'apply.html']
          for name in html_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'assets/logo-(?:base|header)\.svg(?:\?v=\d+)?', f'assets/logo-site.jpg?v={version}', text)
              text = re.sub(r'assets/(?:sample-book-rubiya-cover|rubiya-cover-final)\.svg(?:\?v=\d+)?', f'assets/rubiya-cover-site.jpg?v={version}', text)
              text = re.sub(r'href="styles\.css(?:\?v=\d+)?"', f'href="styles.css?v={version}"', text)
              text = re.sub(r'src="script\.js(?:\?v=\d+)?"', f'src="script.js?v={version}"', text)
              path.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          js = re.sub(r'assets/logo-(?:base|header)\.svg(?:\?v=\d+)?', f'assets/logo-site.jpg?v={version}', js)
          js = re.sub(r'assets/(?:sample-book-rubiya-cover|rubiya-cover-final)\.svg(?:\?v=\d+)?', f'assets/rubiya-cover-site.jpg?v={version}', js)
          js = re.sub(r'mobile-fixes\.css(?:\?v=\d+)?', f'mobile-fixes.css?v={version}', js)
          script.write_text(js, encoding='utf-8')
          PY

      - name: Commit extracted assets
        run: |
          rm -f .github/workflows/convert-svg-wrappers-to-jpg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-site.jpg assets/rubiya-cover-site.jpg index.html products.html stories.html themes.html guide.html apply.html script.js .github/workflows/convert-svg-wrappers-to-jpg.yml
          git commit -m "Use direct JPG assets for logo and Rubiya cover [skip ci]"
          git push
